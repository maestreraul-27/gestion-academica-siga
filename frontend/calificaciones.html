<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificaciones SIGA-WEB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">SIGA-WEB</span>

    <div>
        <a class="btn btn-outline-light btn-sm" href="dashboard.html">Inicio</a>
        <a class="btn btn-outline-light btn-sm" href="estudiantes.html">Estudiantes</a>
        <a class="btn btn-outline-light btn-sm" href="profesores.html">Profesores</a>
        <a class="btn btn-outline-light btn-sm" href="calificaciones.html">Calificaciones</a>
    </div>
    </nav>

<div class="container mt-4">

    <h2 class="text-center">Gestión de Calificaciones</h2>

    <div class="mb-3">
        <input type="number" id="id" class="form-control my-2" placeholder="ID">
        <input type="text" id="estudiante" class="form-control my-2" placeholder="Estudiante">
        <input type="text" id="asignatura" class="form-control my-2" placeholder="Asignatura">
        <input type="number" id="nota" class="form-control my-2" placeholder="Nota">

        <button class="btn btn-success w-100" onclick="crearCalificacion()">Crear</button>
    </div>

    <table class="table table-bordered table-striped text-center">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Estudiante</th>
                <th>Asignatura</th>
                <th>Nota</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaCalificaciones"></tbody>
    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/calificaciones.js"></script>

</body>
</html>
