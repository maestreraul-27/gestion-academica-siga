<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SIGA-WEB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">SIGA-WEB</span>
        <span class="navbar-text text-white-50 small">Gestión Académica</span>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 85vh;">
        <div class="card p-4 shadow-sm" style="width: 350px; border-radius: 12px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">SIGA-WEB</h2>
                <p class="text-muted small">Ingresa tus credenciales de Administrador</p>
            </div>

            <div class="mb-3">
                <label for="usuario" class="form-label text-secondary small">Usuario</label>
                <input type="text" id="usuario" class="form-control" placeholder="Ej: admin">
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label text-secondary small">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••">
            </div>

            <button class="btn btn-primary w-100 py-2 fw-semibold" onclick="login()">Ingresar al Panel</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
