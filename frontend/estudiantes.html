<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudiantes SIGA-WEB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold text-primary">SIGA-WEB</span>
            <div class="navbar-nav ms-auto d-flex flex-row gap-2">
                <a class="btn btn-outline-light btn-sm" href="dashboard.html">Inicio</a>
                <a class="btn btn-outline-light btn-sm active" href="estudiantes.html">Estudiantes</a>
                <a class="btn btn-outline-light btn-sm" href="profesores.html">Profesores</a>
                <a class="btn btn-outline-light btn-sm" href="calificaciones.html">Calificaciones</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <h2 class="text-center fw-bold text-secondary mb-4">Gestión de Estudiantes</h2>

                <div class="card p-4 shadow-sm mb-4 bg-white" style="border-radius: 12px;">
                    <h5 class="text-muted mb-3 small text-uppercase fw-bold">Registrar Nuevo Alumno</h5>
                    
                    <div class="mb-3">
                        <label for="nombre" class="form-label text-secondary small fw-semibold">Nombre Completo</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ej: Juan Pérez">
                    </div>

                    <div class="mb-3">
                        <label for="programa" class="form-label text-secondary small fw-semibold">Programa / Carrera</label>
                        <input type="text" id="programa" class="form-control" placeholder="Ej: Ingeniería de Sistemas">
                    </div>

                    <button class="btn btn-success w-100 py-2 fw-semibold mt-2" onclick="crearEstudiante()">
                        Crear Estudiante
                    </button>
                </div>

                <div class="table-responsive shadow-sm rounded-3">
                    <table class="table table-striped table-hover align-middle text-center mb-0 bg-white">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 15%;">ID</th>
                                <th>Nombre</th>
                                <th>Programa</th>
                                <th style="width: 20%;">Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tablaEstudiantes"></tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/estudiantes.js"></script>
</body>
</html>
