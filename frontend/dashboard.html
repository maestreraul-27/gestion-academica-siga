<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SIGA-WEB</title>
    <!-- Enlace oficial de Bootstrap igual al de estudiantes.html -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

        <!-- Barra de navegación superior blindada -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold text-primary">SIGA-WEB</span>
            <div class="navbar-nav ms-auto d-flex flex-row gap-2">
                <a class="btn btn-outline-light btn-sm active" href="dashboard.html">Inicio</a>
                <a class="btn btn-outline-light btn-sm" href="estudiantes.html">Estudiantes</a>
                <a class="btn btn-outline-light btn-sm" href="calificaciones.html">Calificaciones</a>
            </div>
        </div>
    </nav>


    <!-- Contenedor Principal del Dashboard -->
    <div class="container mt-5">
        <div class="row justify-content-center text-center">
            <div class="col-md-10">
                
                <!-- Encabezado y Datos del Usuario -->
                <div class="card p-4 shadow-sm mb-4 bg-white" style="border-radius: 12px;">
                    <h2 class="fw-bold text-secondary mb-3">Dashboard SIGA-WEB</h2>
                    <div id="infoUsuario" class="fs-5 text-muted my-2">
                        <!-- Automatizado por JS -->
                    </div>
                </div>

                <!-- Contenedor de estadísticas (Se eliminará por completo vía JS si eres Profesor o Estudiante) -->
                <div id="contenedor-estadisticas" class="row g-4 my-3 text-start" style="display: none;">
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-0 border-top border-primary border-5" style="border-radius: 8px;">
                            <div class="card-body p-4">
                                <h5 class="card-title text-muted text-uppercase small fw-bold">Estudiantes</h5>
                                <h2 class="display-5 fw-bold text-primary my-2" id="total-estudiantes">--</h2>
                                <p class="card-text text-secondary small">Alumnos matriculados en el sistema.</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-0 border-top border-success border-5" style="border-radius: 8px;">
                            <div class="card-body p-4">
                                <h5 class="card-title text-muted text-uppercase small fw-bold">Profesores</h5>
                                <h2 class="display-5 fw-bold text-success my-2" id="total-profesores">--</h2>
                                <p class="card-text text-secondary small">Docentes activos en este periodo.</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-0 border-top border-warning border-5" style="border-radius: 8px;">
                            <div class="card-body p-4">
                                <h5 class="card-title text-muted text-uppercase small fw-bold">Calificaciones</h5>
                                <h2 class="display-5 fw-bold text-warning my-2" id="total-calificaciones">--</h2>
                                <p class="card-text text-secondary small">Actas de evaluación procesadas.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botón de Salida -->
                <div class="mt-4">
                    <button class="btn btn-danger px-4 py-2" onclick="cerrarSesion()">Cerrar sesión</button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://jsdelivr.net"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
